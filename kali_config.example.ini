# Copy this file to  kali_config.ini  (git-ignored) and fill in your own key.
# The AI layer is OPTIONAL — Nemesis Analyst runs fully without it, just more deterministically.

[openai]
api_key = sk-REPLACE_WITH_YOUR_OPENAI_KEY
# Optional: point at any OpenAI-compatible endpoint (a local model server, another vendor, ...)
# base_url = http://localhost:11434/v1

# Optional: extra keys for automatic rotation when one hits a rate limit / quota.
[openai_pool]
# key1 = sk-...
# key2 = sk-...
